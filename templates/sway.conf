# agent-shield: Sway config for the agent's headless session.
# Generated by `agent-shield install` from templates/sway.conf.
#
# On purpose, this does NOT include /etc/sway/config.d/. Distro snippets there
# run `systemctl --user import-environment`, which would copy this session's
# WAYLAND_DISPLAY into the services of your real desktop.

# One virtual screen with a fixed size.
output HEADLESS-1 mode --custom @WIDTH@x@HEIGHT@ position 0 0

# X11 apps work too, through this session's own Xwayland (not your desktop's).
xwayland enable

# Plain windows with title bars, so screenshots show which app is which.
default_border normal 2
focus_follows_mouse no

# A virtual mouse, so `swaymsg seat seat0 cursor ...` can click in apps (see pointer.py).
exec @PYTHON@ -I @POINTER@

# Tell agent-shield how to reach this session (read by `env`, `run` and `shot`).
exec env | grep -e ^WAYLAND_DISPLAY= -e ^DISPLAY= -e ^DBUS_SESSION_BUS_ADDRESS= > $XDG_RUNTIME_DIR/env.tmp && mv $XDG_RUNTIME_DIR/env.tmp $XDG_RUNTIME_DIR/env
