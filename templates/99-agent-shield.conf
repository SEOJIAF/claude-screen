# Installed by agent-shield. Remove it with `agent-shield uninstall`.
#
# Tells systemd-logind to do nothing when the lid closes, so an agent session can
# keep running with the lid shut. It applies whenever logind handles the lid;
# KDE and GNOME may handle the lid themselves (agent-shield's inhibitor covers that).
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
